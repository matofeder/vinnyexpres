<VirtualHost 78.47.173.146:80>
    ServerAdmin feder.mato@gmail.com

    ServerName vinny-expres.sk
    ServerAlias www.vinny-expres.sk

    RedirectPermanent / https://vinny-expres.sk/

    ErrorLog ${APACHE_LOG_DIR}/vinny-expres.sk-error.log
    CustomLog ${APACHE_LOG_DIR}/vinny-expres.sk-access.log vhost_combined
</VirtualHost>

<VirtualHost 78.47.173.146:443>
    ServerAdmin feder.mato@gmail.com

    ServerName vinny-expres.sk
    ServerAlias www.vinny-expres.sk

    Include /etc/letsencrypt/options-ssl-apache.conf

    LoadModule proxy_uwsgi_module /usr/lib/apache2/modules/mod_proxy_uwsgi.so
    # Server Certificate
    SSLCertificateFile /etc/letsencrypt/live/vinny-expres.sk/fullchain.pem

    # Server Private Key
    SSLCertificateKeyFile /etc/letsencrypt/live/vinny-expres.sk/privkey.pem

    ProxyPass "/" "uwsgi://127.0.0.1:8184/"
    ProxyPassReverse "/" "uwsgi://localhost::8184/"
    ProxyPreserveHost On

    ErrorLog ${APACHE_LOG_DIR}/vinny-expres.sk-error.log
    CustomLog ${APACHE_LOG_DIR}/vinny-expres.sk-access.log vhost_combined
</VirtualHost>

